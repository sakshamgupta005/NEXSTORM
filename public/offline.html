<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Hackathon Starter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .card {
      max-width: 420px;
      padding: 2.5rem;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      text-align: center;
      margin: 1rem;
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.5rem;
      color: #64748b;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.75rem;
    }
    p {
      color: #64748b;
      line-height: 1.5;
      margin: 0 0 1.5rem;
    }
    .button {
      display: inline-block;
      padding: 0.625rem 1.25rem;
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 500;
      border-radius: 0.5rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-size: 0.875rem;
      transition: background-color 0.15s ease;
    }
    .button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-12.728 0m0 0l2.829-2.829m-2.829 2.829L3 21m2.828-12.536a5 5 0 017.072 0m-7.072 0l2.829 2.829" />
    </svg>
    <h1>You are offline</h1>
    <p>This page is not cached for offline access yet. Please check your internet connection and try reloading.</p>
    <button class="button" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
