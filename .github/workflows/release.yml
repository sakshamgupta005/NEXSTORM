name: Release & Deployment Audit

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-verify:
    name: Release Readiness & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Quality Verification
        run: npm run verify

      - name: Run Release Readiness Audit
        run: npm run release:check

      - name: Validate Container Configuration
        run: npx vitest run tests/unit/deployment-release-toolkit.test.ts
